<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#b8a8c8;font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:0}
.panel{max-width:100%;overflow:hidden}
.panel-hd{background:linear-gradient(160deg,#0a0218,#140820);padding:16px 20px;border-bottom:1px solid rgba(196,32,63,0.2);position:relative}
.panel-hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#c4203f,#b8944e,#7b3fa3,#c4203f)}
.panel-title{font-size:15px;font-weight:700;color:#e8e0f0;letter-spacing:0.04em}
.panel-sub{font-size:11px;color:#786890;margin-top:2px}
.char-card{margin:8px 14px;padding:12px 14px;background:rgba(255,255,255,0.015);border:1px solid rgba(255,255,255,0.04);border-radius:8px}
.char-name{font-size:13px;font-weight:700;color:#e8e0f0;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.04)}
.char-row{display:flex;gap:6px;margin:3px 0;line-height:1.5;font-size:11px}
.char-lb{color:#504868;min-width:32px;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:0.04em}
.char-vl{color:#b8a8c8}
.char-vl.inner{color:#c89090}
.actions{margin:8px 14px;padding:10px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:8px}
.actions-t{font-size:10px;color:#504868;font-weight:700;letter-spacing:0.06em;margin-bottom:6px;text-transform:uppercase}
.act-btn{display:block;width:100%;margin:2px 0;padding:6px 10px;border:1px solid rgba(255,255,255,0.06);border-radius:6px;background:rgba(255,255,255,0.02);color:#786890;font-size:11px;cursor:pointer;text-align:left;transition:all .15s}
.act-btn:hover{background:rgba(196,32,63,0.1);color:#e8e0f0;border-color:rgba(196,32,63,0.3)}
</style></head><body>
<div class="panel">
<div class="panel-hd">
<div class="panel-title">暗香盈袖</div>
<div class="panel-sub">真相揭露期 · 2011/09/01 · 北京首都机场T3</div>
</div>
<div class="char-card">
<div class="char-name">白颖</div>
<div class="char-row"><span class="char-lb">行动</span><span class="char-vl">刚从剑桥回国，扑进左京怀里</span></div>
<div class="char-row"><span class="char-lb">内心</span><span class="char-vl inner">老公来接我了...但我这半年在剑桥的每一天都是谎言</span></div>
<div class="char-row"><span class="char-lb">穿着</span><span class="char-vl">驼色羊毛开衫+牛仔裤，大腿淤青被遮瑕膏盖了三层</span></div>
<div class="char-row"><span class="char-lb">小穴</span><span class="char-vl">蝴蝶屄深处空虚痉挛，被清洗后内壁仍在收缩</span></div>
<div class="char-row"><span class="char-lb">胸部</span><span class="char-vl">D罩杯，乳头因回想粗暴揉捏而微微挺立</span></div>
<div class="char-row"><span class="char-lb">肛门</span><span class="char-vl">紧窄，坚持的防线——「除非左京同意」</span></div>
<div class="char-row"><span class="char-lb">嘴</span><span class="char-vl">漱口水反复漱口，舌根残留排毒胶囊的苦味</span></div>
</div>
<div class="char-card">
<div class="char-name">左京</div>
<div class="char-row"><span class="char-lb">行动</span><span class="char-vl">在到达口等了四十分钟，接过行李箱</span></div>
<div class="char-row"><span class="char-lb">内心</span><span class="char-vl inner">她眼睛红了两次。拥抱太用力了，像是在道歉</span></div>
<div class="char-row"><span class="char-lb">穿着</span><span class="char-vl">深灰休闲衬衫+黑色长裤</span></div>
<div class="char-row"><span class="char-lb">阳具</span><span class="char-vl">疲软，久别重逢的激动中毫无反应</span></div>
</div>
<div class="actions">
<div class="actions-t">行动选项</div>
<button class="act-btn">1. 装作什么都没注意到，接过行李箱直接去停车场</button>
<button class="act-btn">2. 在电梯口停下来，认真看她一眼，问她怎么了</button>
<button class="act-btn">3. 注意到她走路的姿势有些不同——双腿夹得比平时紧</button>
<button class="act-btn">4. 把她拉进怀里深深吻住她的嘴</button>
</div>
</div>
</body></html>
